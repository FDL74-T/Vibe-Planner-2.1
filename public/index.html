<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePlanner - Modern Activity & Calendar Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
    <canvas id="confettiCanvas"></canvas>

    <div class="app-layout">
        <header class="navbar reveal" style="--i:0">
            <div class="brand-group">
                <div class="brand-badge"><span class="brand-dot"></span></div>
                <div>
                    <h1 class="brand-name">VibePlanner</h1>
                    <p class="brand-tagline" id="greetingText">Memuat sapaan...</p>
                </div>
            </div>
            <div class="navbar-actions">
                <div class="autosave-indicator" id="autosaveBadge" data-state="ok">
                    <span class="pulse-dot"></span>
                    <span class="autosave-text">Tersimpan Otomatis</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Ganti tema (D)" aria-label="Ganti tema">🌙</button>
                <div class="clock-chip">
                    <span id="liveClock" class="clock-text">00:00:00</span>
                    <span id="currentDateStr" class="date-text">Memuat...</span>
                </div>
            </div>
        </header>

        <section class="stat-container">
            <div class="stat-card teal active-filter reveal" style="--i:1" data-filter="all" title="Tampilkan semua kegiatan">
                <div class="stat-header"><span class="stat-badge">Semua</span><span class="stat-icon">📋</span></div>
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-meta">Total kegiatan terencana</div>
            </div>
            <div class="stat-card green reveal" style="--i:2" data-filter="completed" title="Filter kegiatan yang selesai">
                <div class="stat-header"><span class="stat-badge">Progres</span><span class="stat-icon">🎯</span></div>
                <div class="stat-number" id="statCompleted">0</div>
                <div class="stat-meta" id="statProgressLabel">Selesai (0%)</div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar"></div></div>
            </div>
            <div class="stat-card amber reveal" style="--i:3" data-filter="pending" title="Filter kegiatan yang belum selesai">
                <div class="stat-header"><span class="stat-badge">Tertunda</span><span class="stat-icon">⏳</span></div>
                <div class="stat-number" id="statPending">0</div>
                <div class="stat-meta">Sedang berjalan / menunggu</div>
            </div>
        </section>

        <section class="insight-grid">
            <div class="card-panel reveal" style="--i:4">
                <div class="panel-header"><h2 class="panel-title">Aktivitas 7 Hari</h2><span class="panel-pill" id="streakPill">🔥 0 hari</span></div>
                <div class="week-chart" id="weekChart"></div>
            </div>
            <div class="card-panel focus-card reveal" style="--i:5">
                <div class="panel-header"><h2 class="panel-title">Mode Fokus</h2><span class="panel-pill" id="focusCount">0 sesi hari ini</span></div>
                <div class="focus-body">
                    <div class="ring">
                        <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
                        <div class="ring-time" id="focusTime">25:00</div>
                    </div>
                    <div class="focus-ctrl">
                        <select id="focusTask" aria-label="Pilih kegiatan untuk difokuskan"></select>
                        <div class="prio-seg" id="focusLen"><button data-m="15">15m</button><button data-m="25" class="on">25m</button><button data-m="45">45m</button></div>
                        <div class="focus-btns"><button class="btn-submit" id="focusStart">▶ Mulai</button><button class="btn-action" id="focusReset" title="Reset">↺</button></div>
                    </div>
                </div>
            </div>
        </section>
        <div class="main-grid">
            <section
